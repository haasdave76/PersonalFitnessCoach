<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0c1727"><title>Personal Fitness Coach</title>
<style>

ansparent;color:var(--muted);font-size:14px}.tabs button.active{background:var(--panel2);color:var(--mint)}.exercise{padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}.setrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.setrow input{width:94px}.setrow button{padding:10px}.small{font-size:13px}.stack{display:grid;gap:8px}.empty{padding:18px;color:var(--muted);text-align:center}.notice{border-left:3px solid var(--mint);padding:10px 12px;background:#173347;border-radius:5px;margin:12px 0}.error{border-left-color:var(--red)}.hide{display:none!important}.authbox{margin-top:8px}.authbox .grid{margin:8px 0}.syncstatus{font-size:13px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}.syncerror{color:var(--red)}summary{cursor:pointer;font-weight:700}details{margin-top:10px}#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#225747;color:#fff;padding:10px 16px;border-radius:10px;z-index:10;display:none;max-width:90%;text-align:center}@media(max-width:360px){.grid3{grid-template-columns:1fr}.setrow input{width:75px}.wrap{padding-left:12px;padding-right:12px}}

.coach-chat{display:grid;gap:10px;max-height:330px;overflow:auto;margin:10px 0;padding:8px;background:#0d1b2d;border-radius:12px}.bubble{padding:11px 13px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{background:#214957;margin-left:30px}.bubble.ai{background:#24364d;margin-right:20px}.coach-input{display:flex;gap:7px;align-items:stretch}.coach-input input{min-width:0;flex:1}.coach-input button{white-space:nowrap}.listening{background:#9bd4fa!important}.ai-chat-disabled{opacity:.6}.coach-helper{font-size:12px;color:var(--muted)}

.recommend-card{border:1px solid #397c77;background:linear-gradient(155deg,#183e4a,#12283b 80%);padding:17px;border-radius:18px;margin:14px 0;box-shadow:0 12px 30px #04111d55}
.recommend-card .kicker{color:#8de9d2;font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:800}
.recommend-stats{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin:12px 0}.recommend-stats .metric{background:#0923338f;padding:13px;border-radius:12px}.recommend-stats strong{font-size:30px;display:block;line-height:1.2}.recommend-stats small{color:var(--muted)}
.plate-svg{display:block;width:100%;max-width:520px;margin:6px auto;overflow:visible}.plates-label{text-align:center;color:#c1ded9;font-size:13px;margin:10px 0}.coach-actions{display:flex;gap:8px;flex-wrap:wrap}.coach-actions button{flex:1;min-width:125px}.mini-plate{display:inline-block;border-radius:6px;padding:3px 8px;margin:3px 2px;color:white;background:#3b82a8;font-size:13px;font-weight:800}.warn-mini{color:#ffc7b2;font-size:12px}.bubble.ai{white-space:pre-wrap}.coach-chat{max-height:250px}.recommend-card .disclaimer{font-size:12px;color:var(--muted)}
</style></head><body><main class="wrap"><div class="eyebrow">Personal Fitness Coach • HTML Edition</div><h1 id="heading">Your Coach</h1><div id="account"></div><div id="app"><p>Loading your fitness coach…</p></div></main><nav class="tabs" aria-label="Main navigation"><button data-tab="coach" class="active">⌂ Coach</button><button data-tab="workout">▤ Workout</button><button data-tab="progress">▥ Progress</button></nav><div id="toast" role="status"></div>
<script>
(function(){'use strict';
var KEY='personal_fitness_coach_html_v1';
var AUTH_KEY='personal_fitness_coach_supabase_auth_v1';
var SUPABASE_URL='https://soerkequbxfgeldzexpy.supabase.co';
var SUPABASE_KEY='sb_publishable_k6gK6Q-5_hpTUji9X5SrEg_ipnxaaKK';
var chatMessages=[],chatBusy=false,dictating=false,speechRecognition=null,latestRecommendation=null;
var auth=null, syncBusy=false, syncNotice='Sign in to sync between devices.', lastSyncAt=0;
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}
function authStore(){try{if(auth)localStorage.setItem(AUTH_KEY,JSON.stringify(auth));else localStorage.removeItem(AUTH_KEY)}catch(e){}}
try{auth=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){auth=null}

var template={upperA:[['Barbell Bench Press',3,8,10],['Seated Cable Row',3,10,12],['Dumbbell Shoulder Press',3,8,10],['Lat Pulldown',3,10,12],['Biceps Curl',2,10,12],['Triceps Pushdown',2,10,12],['Face Pull',2,12,15]],lowerA:[['Goblet Squat',3,10,12],['Barbell Romanian Deadlift',3,8,10],['Leg Press',3,10,12],['Seated Leg Curl',3,10,12],['Standing Calf Raise',3,12,15],['Forearm Plank',3,30,45]],upperB:[['Incline Dumbbell Press',3,8,10],['Cable Row',3,10,12],['Vertical Pulldown',3,10,12],['Lateral Raise',3,12,15],['Biceps Curl',2,10,12],['Triceps Extension',2,10,12],['Rear Delt Fly',2,12,15]],lowerB:[['Trap Bar Deadlift',3,6,8],['Split Squat',3,8,10],['Seated Leg Curl',3,10,12],['Leg Extension',3,10,12],['Calf Raise',3,12,15],['Cable Crunch',3,10,15]]};
var names={upperA:'Upper A',lowerA:'Lower A',upperB:'Upper B',lowerB:'Lower B',makeup:'Full-Body Makeup'};
var defaults={sessions:[],active:null,meals:[],weights:[],settings:{calories:2500,protein:180,carbs:265,fat:80},tab:'coach',restEnd:0};
function clone(x){return JSON.parse(JSON.stringify(x));}
function load(){try{var saved=JSON.parse(localStorage.getItem(KEY)||'{}');var out=clone(defaults);Object.keys(out).forEach(function(k){if(saved[k]!==undefined)out[k]=saved[k]});return out;}catch(e){return clone(defaults);}}
var state=load();var root=document.getElementById('app');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Browser storage unavailable. Export your records to keep them.');}}
function esc(s){return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(s){var el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(function(){el.style.display='none'},2600)}
function localDay(){var d=new Date().getDay();return d===1?'upperA':d===2?'lowerA':d===4?'upperB':d===5?'lowerB':d===0?'upperA':d===3?'upperB':'lowerB'}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function optionSet(key){return '<option value="'+key+'">'+names[key]+'</option>'}
function recommend(){var day=new Date().getDay();return {key:localDay(),when:([0,3,6].indexOf(day)>=0?'Next scheduled workout':'Scheduled for today')}}
function renderCoach(){var r=recommend(),history=state.sessions.length?state.sessions[0]:null,meal=totals();return '<div class="card"><div class="row"><div><div class="eyebrow">'+r.when+'</div><h2>'+names[r.key]+'</h2><p class="muted">Your 4-day strength plan • 60-minute default</p></div><span class="pill">Ready</span></div><button class="wide" data-action="choose-workout" data-key="'+r.key+'">Start guided workout</button><p class="hint" style="margin-top:9px">Missed a day? Choose Full-Body Makeup in the Workout tab.</p></div><div class="grid"><div class="stat"><span>Completed workouts</span><strong>'+state.sessions.length+'</strong></div><div class="stat"><span>Logged sets</span><strong>'+state.sessions.reduce(function(a,s){return a+s.exercises.reduce(function(b,e){return b+e.logs.length},0)},0)+'</strong></div></div><div class="card"><div class="row"><h3>Today&#39;s nutrition</h3><span class="muted small">'+today()+'</span></div><div class="grid"><div class="stat"><span>Calories</span><strong>'+Math.round(meal.calories)+' / '+state.settings.calories+'</strong></div><div class="stat"><span>Protein (g)</span><strong>'+Math.round(meal.protein)+' / '+state.settings.protein+'</strong></div><div class="stat"><span>Carbs (g)</span><strong>'+Math.round(meal.carbs)+' / '+state.settings.carbs+'</strong></div><div class="stat"><span>Fat (g)</span><strong>'+Math.round(meal.fat)+' / '+state.settings.fat+'</strong></div></div><details><summary>Log a meal (manual estimates)</summary><form id="meal-form" class="stack"><label>Meal description<input name="name" required placeholder="Chicken bowl, protein shake…"></label><div class="grid"><label>Calories<input name="calories" type="number" min="0" step="1" required></label><label>Protein (g)<input name="protein" type="number" min="0" step="0.1" required></label><label>Carbs (g)<input name="carbs" type="number" min="0" step="0.1" required></label><label>Fat (g)<input name="fat" type="number" min="0" step="0.1" required></label></div><button>Save meal</button></form><p class="hint">Photo-based AI estimates are not included in this offline version.</p></details>'+state.meals.filter(function(m){return m.date===today()}).map(function(m){return '<div class="exercise row"><span>'+esc(m.name)+' <span class="hint">'+Math.round(m.calories)+' kcal · '+Math.round(m.protein)+'g protein</span></span><button class="secondary small" data-action="delete-meal" data-id="'+m.id+'">Remove</button></div>'}).join('')+'</div>'+(history?'<div class="card"><h3>Last completed workout</h3><p>'+esc(history.name)+' · '+esc(history.date)+' · '+history.exercises.reduce(function(a,e){return a+e.logs.length},0)+' sets</p></div>':'')}
function totals(){return state.meals.filter(function(m){return m.date===today()}).reduce(function(a,m){['calories','protein','carbs','fat'].forEach(function(k){a[k]+=Number(m[k])||0});return a},{calories:0,protein:0,carbs:0,fat:0})}
function makeExercises(key){if(key==='makeup'){return [template.upperA[0],template.lowerA[0],template.upperA[1],template.lowerA[1],template.upperB[3],template.lowerA[5]].map(function(e){return {name:e[0],target:2,min:e[2],max:e[3],logs:[]}})}return template[key].map(function(e){return {name:e[0],target:e[1],min:e[2],max:e[3],logs:[]}})}
// Deterministic barbell calculator. Never accept plate arithmetic from the language model.
var AVAILABLE_PLATES=[45,35,25,10,5,2.5];
function calculatePlates(total){var units=Math.round((Number(total)-45)*2);if(!Number.isFinite(total)||total<45||Math.abs(units-((Number(total)-45)*2))>0.00001)return null; // half-pound internal units
var perSide=(total-45)/2, rem=Math.round(perSide*2), found=[];
for(var i=0;i<AVAILABLE_PLATES.length;i++){var p=AVAILABLE_PLATES[i],n=Math.floor(rem/Math.round(p*2));for(var j=0;j<n;j++)found.push(p);rem-=n*Math.round(p*2)}
if(rem!==0||Math.abs((45+2*found.reduce(function(a,b){return a+b},0))-total)>0.001)return null;
return {total:total,perSide:perSide,plates:found};}
function barDiagram(load){var plates=load.plates.slice(0,8),sizes={45:43,35:38,25:33,10:26,5:22,2.5:18},colors={45:'#2877c5',35:'#3298ac',25:'#36b68d',10:'#e1a84b',5:'#d57965',2.5:'#9e84e2'};
var left='',right='';plates.forEach(function(p,i){var h=sizes[p],x=138-i*12;left+='<rect x="'+x+'" y="'+(60-h)+'" width="11" height="'+(h*2)+'" rx="2" fill="'+colors[p]+'" stroke="#173342" stroke-width="1"/>';right+='<rect x="'+(211+i*12)+'" y="'+(60-h)+'" width="11" height="'+(h*2)+'" rx="2" fill="'+colors[p]+'" stroke="#173342" stroke-width="1"/>'});
return '<svg class="plate-svg" viewBox="0 0 350 122" role="img" aria-label="45 pound bar with '+esc(load.plates.join(' plus ')||'no plates')+' on each side"><rect x="12" y="54" width="326" height="12" rx="5" fill="#a5b0bf"/><rect x="140" y="48" width="70" height="24" rx="4" fill="#c9d3dc"/>'+left+right+'<text x="175" y="110" fill="#a8c0c9" font-size="11" text-anchor="middle">45 lb bar · symmetric loading</text></svg>';}
function recommendationHtml(){if(!latestRecommendation)return '';var r=latestRecommendation,load=calculatePlates(r.total_lb);if(!load)return '<div class="card">Suggested barbell weight cannot be loaded with the configured plates. Please check available equipment.</div>';
var delta=r.previous_total_lb!==null?(r.total_lb-r.previous_total_lb):null;
return '<section class="recommend-card" aria-label="Next set recommendation"><div class="kicker">✦ Your next set</div><h3 style="margin:5px 0">'+esc(r.exercise||'Barbell exercise')+'</h3><div class="recommend-stats"><div class="metric"><small>Total bar weight</small><strong>'+load.total+' <small>lb</small></strong></div><div class="metric"><small>'+(delta===null?'Each side': 'Change from last')+'</small><strong>'+(delta===null?load.perSide+' lb':(delta>0?'+':'')+delta+' lb')+'</strong></div></div>'+barDiagram(load)+'<div class="plates-label">On <b>each side</b> of the bar</div><div style="text-align:center">'+(load.plates.length?load.plates.map(function(p){return '<span class="mini-plate">'+p+' lb</span>'}).join(''):'No plates · empty bar')+'</div><div class="plates-label">45 + (2 × '+load.perSide+') = <b>'+load.total+' lb total</b></div><p class="disclaimer">'+esc(r.reason||'Check form and effort before changing weight.')+'</p><p class="disclaimer">'+(state.active?'Accept fills the matching exercise form; it does not log a completed set.':'Start a workout to apply this weight. Nothing has been logged.')+'</p><div class="coach-actions"><button data-action="accept-ai-weight" '+(state.active?'':'disabled')+'>Use '+load.total+' lb</button><button class="secondary" data-action="keep-ai-weight">Keep current</button></div></section>';}
function aiChatHtml(){return '<div class="card"><div class="row"><div><div class="eyebrow">AI workout coach</div><h3>Ask your coach</h3></div><span class="pill">Text + tap to speak</span></div><p class="hint">Ask for weight changes, plate setup, exercise swaps, or guidance based on completed sets. AI suggestions never change logged workouts without your confirmation.</p>'+recommendationHtml()+'<div class="coach-chat" role="log" aria-live="polite">'+(chatMessages.length?chatMessages.slice(-12).map(function(m){return '<div class="bubble '+(m.role==='user'?'user':'ai')+'"><strong>'+(m.role==='user'?'You':'Coach')+'</strong>\n'+esc(m.text)+'</div>'}).join(''):'<div class="hint">Try: “I did 10 reps at 115 pounds and it felt easy. What next?”</div>')+'</div><form id="ai-chat-form" class="coach-input"><input name="question" id="ai-question" aria-label="Ask your fitness coach" placeholder="Ask about your next set…" maxlength="1000" required '+(chatBusy?'disabled':'')+'><button type="button" class="secondary" id="ai-mic" data-action="ai-mic" title="Tap to dictate" '+(chatBusy?'disabled':'')+'>🎤</button><button type="submit" '+(chatBusy?'disabled':'')+'>'+(chatBusy?'…':'Send')+'</button></form><p class="coach-helper" id="mic-status">'+(chatBusy?'Thinking…':'Speech input depends on browser support. Never use while driving.')+'</p></div>'}
async function askCoach(question){if(chatBusy||!auth||!auth.access_token)return;chatBusy=true;chatMessages.push({role:'user',text:question});render();try{var workout=state.active?{name:state.active.name,minutes:state.active.minutes,exercises:state.active.exercises.map(function(e){return{name:e.name,target:e.target,repRange:[e.min,e.max],sets:e.logs.map(function(l){return{weight_lb:l.weight,reps:l.reps,effort:l.effort}})}})}:null;var recent=chatMessages.slice(-8).map(function(m){return{role:m.role==='user'?'user':'assistant',content:m.text}});var r=await fetch(SUPABASE_URL+'/functions/v1/fitness-coach',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+auth.access_token,'Content-Type':'application/json'},body:JSON.stringify({message:question,workout:workout,messages:recent})});var j=await r.json().catch(function(){return{}});if(!r.ok)throw Error(j.error||('Function error '+r.status));chatMessages.push({role:'assistant',text:String(j.reply||'No response received.')});latestRecommendation=j.recommendation&&Number.isFinite(Number(j.recommendation.total_lb))?j.recommendation:null;}catch(err){chatMessages.push({role:'assistant',text:'AI connection failed: '+err.message+'. Check that the Supabase Edge Function is deployed and its secret is configured.'})}finally{chatBusy=false;render();var log=document.querySelector('.coach-chat');if(log)log.scrollTop=log.scrollHeight}}
function tapToSpeak(){var Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){toast('Speech recognition is unavailable in this browser. Use the keyboard.');return}if(dictating&&speechRecognition){speechRecognition.stop();return}var input=document.getElementById('ai-question');if(!input)return;var rec=new Speech();speechRecognition=rec;rec.lang='en-US';rec.continuous=false;rec.interimResults=false;rec.onresult=function(e){var words=e.results[0][0].transcript;var field=document.getElementById('ai-question');if(field){field.value=(field.value?field.value+' ':'')+words;field.focus()}};rec.onerror=function(e){toast('Microphone: '+e.error)};rec.onend=function(){dictating=false;var status=document.getElementById('mic-status');if(status)status.textContent='Dictation finished. Review your words, then tap Send.';var mic=document.getElementById('ai-mic');if(mic)mic.classList.remove('listening')};try{rec.start();dictating=true;var status=document.getElementById('mic-status');if(status)status.textContent='Listening… tap microphone again to stop';document.getElementById('ai-mic').classList.add('listening')}catch(e){toast('Could not start microphone: '+e.message)}}

function renderWorkout(){var a=state.active;if(!a){return '<div class="card"><h2>Choose a workout</h2><label>Workout plan<select id="workout-type">'+['upperA','lowerA','upperB','lowerB','makeup'].map(optionSet).join('')+'</select></label><label>Available minutes<select id="duration"><option>60</option><option>45</option><option>80</option></select></label><button class="wide" data-action="start-workout">Begin workout</button><p class="hint" style="margin-top:10px">For a missed session, choose Full-Body Makeup: balanced, reduced-volume training. You can adjust the duration.</p></div><div class="card"><h3>Weekly plan</h3><p>Monday · Upper A<br>Tuesday · Lower A<br>Thursday · Upper B<br>Friday · Lower B</p></div>'+aiChatHtml()}
var count=a.exercises.reduce(function(n,e){return n+e.logs.length},0),target=a.exercises.reduce(function(n,e){return n+e.target},0),remain=Math.max(0,Math.ceil((state.restEnd-Date.now())/1000));return '<div class="card"><div class="eyebrow">Active session</div><div class="row"><h2>'+esc(a.name)+'</h2><span class="pill">'+count+' / '+target+' sets</span></div><p class="muted">'+a.minutes+'-minute plan · '+esc(a.date)+'</p><div class="notice" id="rest-note">'+(remain>0?'Rest: <strong id="rest-counter">'+remain+'</strong> seconds remaining':'Ready for the next set')+'</div><div class="row"><button class="secondary" data-action="start-rest">Rest 90 sec</button><button class="secondary" data-action="clear-rest">Skip rest</button></div></div>'+aiChatHtml()+a.exercises.map(function(e,i){var previous=lastWeight(e.name);return '<div class="card"><div class="row"><h3>'+(i+1)+'. '+esc(e.name)+'</h3><span class="pill">'+e.logs.length+'/'+e.target+'</span></div><p class="hint">Goal '+e.target+' × '+e.min+'–'+e.max+(e.name.indexOf('Plank')>=0?' seconds':' reps')+(previous!==null?' · Last used: '+previous+' lb':'')+'</p>'+e.logs.map(function(s,j){return '<div class="exercise row"><span>Set '+(j+1)+': '+esc(s.weight)+' '+(e.name.indexOf('Plank')>=0?'sec':'lb')+' × '+esc(s.reps)+(s.effort?' · '+esc(s.effort):'')+'</span><button class="secondary" data-action="undo-set" data-i="'+i+'">Undo</button></div>'}).join('')+(e.logs.length<e.target?'<form class="setrow log-form" data-i="'+i+'"><label>Weight (total lb for barbell) / sec<input name="weight" type="number" min="0" step="0.5" placeholder="lb" value="'+(previous!==null?previous:'')+'" required></label><label>Reps / sec<input name="reps" type="number" min="1" max="300" placeholder="Reps" required></label><label>Effort<select name="effort"><option>Moderate</option><option>Easy</option><option>Hard</option></select></label><button type="submit">Log set</button></form>':'<p class="hint">✓ All planned sets logged</p>')+'</div>'}).join('')+'<div class="card"><button class="wide" data-action="finish-workout">Finish and save workout</button><button class="wide secondary" data-action="discard-workout">Discard this session</button></div>'}
function lastWeight(name){for(var i=0;i<state.sessions.length;i++){var ex=state.sessions[i].exercises.find(function(e){return e.name===name&&e.logs.length});if(ex)return ex.logs[ex.logs.length-1].weight;}return null}
function renderProgress(){return '<div class="card"><h2>Body-weight trend</h2><form id="weight-form" class="row"><label style="flex:1">Weight (lb)<input name="weight" type="number" min="50" max="800" step="0.1" placeholder="e.g. 236.6" required></label><button style="margin-top:17px">Log weight</button></form>'+state.weights.slice(0,10).map(function(w){return '<div class="exercise row"><span>'+esc(w.date)+'</span><strong>'+w.weight+' lb</strong></div>'}).join('')+'</div><div class="card"><h2>Workout history</h2>'+(state.sessions.length?state.sessions.map(function(s){var sets=s.exercises.reduce(function(a,e){return a+e.logs.length},0);return '<details class="exercise"><summary>'+esc(s.date)+' · '+esc(s.name)+' ('+sets+' sets)</summary>'+s.exercises.map(function(e){return '<p class="small">'+esc(e.name)+': '+e.logs.map(function(l){return esc(l.weight)+'×'+esc(l.reps)}).join(', ')+'</p>'}).join('')+'</details>'}).join(''):'<div class="empty">No completed workouts yet.</div>')+'</div><div class="card"><h2>Data and backups</h2><p class="hint">Records are backed up locally and can sync to your Supabase account when signed in. Export a JSON backup periodically; active unfinished workouts remain on this device until finished.</p><button class="wide" data-action="export">Export data as JSON</button><label>Restore JSON backup<input type="file" id="import-file" accept="application/json,.json"></label><details><summary>Daily nutrition targets</summary><form id="goals-form" class="grid">'+['calories','protein','carbs','fat'].map(function(k){return '<label>'+k.charAt(0).toUpperCase()+k.slice(1)+'<input type="number" name="'+k+'" min="0" value="'+state.settings[k]+'" required></label>'}).join('')+'<button>Save goals</button></form></details></div>'}
function render(){renderAccount();var signedIn=!!(auth&&auth.access_token);document.querySelector('.tabs').classList.toggle('hide',!signedIn);if(!signedIn){document.getElementById('heading').textContent='Welcome back';root.innerHTML='';return;}document.getElementById('heading').textContent=state.tab==='coach'?'Your Coach':state.tab==='workout'?'Workout':'Progress';root.innerHTML=state.tab==='coach'?renderCoach():state.tab==='workout'?renderWorkout():renderProgress();document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===state.tab)})}
function start(key,minutes){if(state.active){toast('Finish or discard your current session first.');return}var es=makeExercises(key);if(minutes===45)es=es.slice(0,Math.min(5,es.length)).map(function(e){e.target=Math.min(e.target,2);return e});state.active={id:Date.now(),startedAt:new Date().toISOString(),name:names[key],key:key,date:today(),minutes:minutes,exercises:es};state.tab='workout';state.restEnd=0;save();render()}
function download(name,contents){var blob=new Blob([contents],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},3000)}
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-tab],[data-action]');if(!t)return;if(!(auth&&auth.access_token))return;var tab=t.getAttribute('data-tab');if(tab){state.tab=tab;save();render();return}var action=t.getAttribute('data-action');if(action==='accept-ai-weight'){if(!state.active||!latestRecommendation)return;var ix=state.active.exercises.findIndex(function(e){var a=e.name.toLowerCase(),b=String(latestRecommendation.exercise||'').toLowerCase();return a===b||(b.length>4&&(a.includes(b)||b.includes(a)))});if(ix<0){toast('Exercise not in current workout. Enter weight manually.');return}var inp=document.querySelector('.log-form[data-i="'+ix+'"] input[name="weight"]');if(!inp){toast('All sets for this exercise are logged.');return}inp.value=latestRecommendation.total_lb;inp.focus();toast('Filled '+latestRecommendation.total_lb+' lb TOTAL; review before logging.');return}else if(action==='keep-ai-weight'){latestRecommendation=null;render();return}else if(action==='choose-workout'){start(t.getAttribute('data-key'),60)}else if(action==='start-workout'){start(document.getElementById('workout-type').value,Number(document.getElementById('duration').value))}else if(action==='undo-set'){var x=state.active.exercises[Number(t.getAttribute('data-i'))];x.logs.pop();save();render()}else if(action==='start-rest'){state.restEnd=Date.now()+90000;save();render()}else if(action==='clear-rest'){state.restEnd=0;save();render()}else if(action==='finish-workout'){if(!state.active)return;if(!state.active.exercises.some(function(e){return e.logs.length})){toast('Log at least one set first.');return}state.sessions.unshift(state.active);state.active=null;state.restEnd=0;state.tab='progress';save();render();toast('Workout saved!');if(auth)syncCloud()}else if(action==='discard-workout'){if(confirm('Discard the unfinished workout?')){state.active=null;state.restEnd=0;save();render()}}else if(action==='delete-meal'){removeMeal(t.getAttribute('data-id'))}else if(action==='export'){download('fitness-coach-backup-'+today()+'.json',JSON.stringify(state,null,2));toast('Backup file downloaded')}});
document.addEventListener('submit',function(ev){var f=ev.target;if(!f.matches('.log-form,#meal-form,#weight-form,#goals-form'))return;ev.preventDefault();if(!(auth&&auth.access_token))return;var data=new FormData(f);if(f.matches('.log-form')){var e=state.active.exercises[Number(f.getAttribute('data-i'))];e.logs.push({cloudId:uid(),weight:Number(data.get('weight')),reps:Number(data.get('reps')),effort:String(data.get('effort'))});state.restEnd=Date.now()+90000;toast('Set logged · 90-second rest started')}else if(f.id==='meal-form'){state.meals.unshift({id:uid(),date:today(),name:String(data.get('name')),calories:Number(data.get('calories')),protein:Number(data.get('protein')),carbs:Number(data.get('carbs')),fat:Number(data.get('fat'))});toast('Meal logged');setTimeout(function(){if(auth)syncCloud()},0)}else if(f.id==='weight-form'){state.weights.unshift({id:uid(),date:today(),weight:Number(data.get('weight'))});toast('Weight logged');setTimeout(function(){if(auth)syncCloud()},0)}else if(f.id==='goals-form'){['calories','protein','carbs','fat'].forEach(function(k){state.settings[k]=Number(data.get(k))});toast('Goals saved')}save();render()});
document.addEventListener('change',function(ev){if(ev.target.id!=='import-file'||!ev.target.files.length||!(auth&&auth.access_token))return;var reader=new FileReader();reader.onload=function(){try{var incoming=JSON.parse(reader.result);if(!incoming||!Array.isArray(incoming.sessions)||!Array.isArray(incoming.meals)||!Array.isArray(incoming.weights))throw Error('Unexpected file format');if(!confirm('Replace current local fitness data with this backup?'))return;state=Object.assign(clone(defaults),incoming);state.tab='progress';save();render();toast('Backup restored');if(auth)syncCloud()}catch(err){alert('Could not restore: '+err.message)}};reader.readAsText(ev.target.files[0])});
// Supabase Auth + PostgREST: only the publishable browser key is embedded.
function renderAccount(){var e=document.getElementById('account');if(!e)return;
if(auth&&auth.access_token){e.innerHTML='<div class="card authbox"><div class="row"><div><strong>☁ Cloud sync connected</strong><div class="hint">'+esc(auth.user&&auth.user.email||'Signed in')+'</div></div><button class="secondary" data-action="logout">Sign out</button></div><div class="syncstatus'+(syncNotice.indexOf('error')>=0?' syncerror':'')+'">'+esc(syncNotice)+'</div><button class="wide secondary" data-action="sync-now" '+(syncBusy?'disabled':'')+'>↻ '+(syncBusy?'Syncing…':'Sync now')+'</button></div>';return}
e.innerHTML='<div class="card authbox"><h3>☁ Sync your workouts on every device</h3><p class="hint">Sign in with the same email on your iPhone and computer. Existing browser records can be uploaded after sign-in.</p><form id="auth-form" class="stack"><label>Email<input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" minlength="6" required placeholder="Your Supabase account password"></label><div class="grid"><button type="submit" name="mode" value="signin">Sign in</button><button class="secondary" type="submit" name="mode" value="signup">Create account</button></div></form><div class="syncstatus">'+esc(syncNotice)+'</div><p class="hint">Sign in to access your fitness dashboard. Cloud sync requires an internet connection and a verified account.</p></div>'}
async function request(path,opts,refresh){opts=opts||{};var headers=Object.assign({'apikey':SUPABASE_KEY},opts.headers||{});if(auth&&auth.access_token)headers.Authorization='Bearer '+auth.access_token;
var r=await fetch(SUPABASE_URL+path,Object.assign({},opts,{headers:headers}));
if(r.status===401&&refresh!==false&&auth&&auth.refresh_token){await refreshToken();return request(path,opts,false)}
if(!r.ok){var detail='';try{var obj=await r.json();detail=obj.msg||obj.message||obj.error_description||obj.error||JSON.stringify(obj)}catch(e){detail=await r.text()}throw Error(detail||('HTTP '+r.status))}
if(r.status===204)return null;var txt=await r.text();return txt?JSON.parse(txt):null}
async function refreshToken(){if(!auth||!auth.refresh_token)throw Error('Please sign in again.');var r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:auth.refresh_token})});var j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||'Session expired; please sign in again.');auth=j;authStore()}
async function authenticate(email,password,signup){var path=signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password';var data=signup?{email:email,password:password}:{email:email,password:password};var r=await fetch(SUPABASE_URL+path,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(data)});var j=await r.json();if(!r.ok)throw Error(j.msg||j.error_description||j.message||'Could not authenticate');if(!j.access_token){syncNotice='Check your email for the confirmation link, then return here and sign in.';render();return}auth=j;authStore();syncNotice='Signed in. Loading cloud records…';render();await syncCloud()}
function ensureIds(){state.sessions.forEach(function(sess){if(!sess.startedAt){sess.startedAt=new Date(typeof sess.id==='number'?sess.id:Date.parse(sess.date+'T12:00:00')||Date.now()).toISOString()}sess.exercises.forEach(function(ex){ex.logs.forEach(function(l){if(!l.cloudId)l.cloudId=uid()})})});state.meals.forEach(function(m){if(!isUUID(m.id))m.id=uid()});state.weights.forEach(function(w){if(!isUUID(w.id))w.id=uid()});save()}
function isUUID(v){return typeof v==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v)}
function sessionToRows(){var rows=[];state.sessions.forEach(function(sess){sess.exercises.forEach(function(ex){ex.logs.forEach(function(l,idx){rows.push({id:l.cloudId,user_id:auth.user.id,performed_at:sess.startedAt,workout_name:sess.name,exercise_name:ex.name,set_number:idx+1,weight_lb:Number(l.weight),reps:Number(l.reps),effort:l.effort||null})})})});return rows}
function dateToIso(date){return /^\d{4}-\d{2}-\d{2}$/.test(date)?new Date(date+'T12:00:00').toISOString():new Date().toISOString()}
function mealRows(){return state.meals.map(function(m){return{id:m.id,user_id:auth.user.id,recorded_at:dateToIso(m.date),food_name:m.name,calories:Number(m.calories)||0,protein_g:Number(m.protein)||0,carbs_g:Number(m.carbs)||0,fat_g:Number(m.fat)||0}})}
function weightRows(){return state.weights.map(function(w){return{id:w.id,user_id:auth.user.id,recorded_at:dateToIso(w.date),weight_lb:Number(w.weight)||0}})}
async function getAll(table){var rows=[],offset=0,chunk;do{chunk=await request('/rest/v1/'+table+'?select=*&order=created_at.desc&limit=1000&offset='+offset,{headers:{'Accept':'application/json'}}).catch(async function(err){if(table!=='body_weights'&&table!=='nutrition_entries')throw err;return request('/rest/v1/'+table+'?select=*&limit=1000&offset='+offset,{headers:{'Accept':'application/json'}})});rows=rows.concat(chunk);offset+=chunk.length}while(chunk.length===1000);return rows}
async function upsert(table,rows){for(var i=0;i<rows.length;i+=150){await request('/rest/v1/'+table+'?on_conflict=id',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows.slice(i,i+150))})}}
function mergeCloud(sets,weights,meals){var known=new Set();state.sessions.forEach(function(sess){sess.exercises.forEach(function(ex){ex.logs.forEach(function(l){known.add(l.cloudId)})})});
var groups={};sets.forEach(function(row){if(known.has(row.id))return;var key=row.performed_at+'|'+row.workout_name;if(!groups[key])groups[key]={id:Date.parse(row.performed_at),startedAt:row.performed_at,date:row.performed_at.slice(0,10),name:row.workout_name,key:'cloud',minutes:60,exercises:[]};var sess=groups[key];var ex=sess.exercises.find(function(e){return e.name===row.exercise_name});if(!ex){ex={name:row.exercise_name,target:3,min:8,max:12,logs:[]};sess.exercises.push(ex)}ex.logs.push({cloudId:row.id,weight:Number(row.weight_lb),reps:Number(row.reps),effort:row.effort||''});known.add(row.id)});
Object.keys(groups).forEach(function(k){state.sessions.push(groups[k])});state.sessions.sort(function(a,b){return Date.parse(b.startedAt||b.date)-Date.parse(a.startedAt||a.date)});
var haveWeights=new Set(state.weights.map(function(w){return w.id}));weights.forEach(function(w){if(!haveWeights.has(w.id))state.weights.push({id:w.id,date:w.recorded_at.slice(0,10),weight:Number(w.weight_lb)})});state.weights.sort(function(a,b){return b.date.localeCompare(a.date)});
var haveMeals=new Set(state.meals.map(function(m){return m.id}));meals.forEach(function(m){if(!haveMeals.has(m.id))state.meals.push({id:m.id,date:m.recorded_at.slice(0,10),name:m.food_name,calories:Number(m.calories),protein:Number(m.protein_g),carbs:Number(m.carbs_g),fat:Number(m.fat_g)})});state.meals.sort(function(a,b){return b.date.localeCompare(a.date)});save()}
async function syncCloud(){if(!auth||!auth.access_token||syncBusy)return;syncBusy=true;syncNotice='Syncing workout, nutrition, and weight records…';renderAccount();try{ensureIds();var tables=await Promise.all([getAll('workout_sets'),getAll('body_weights'),getAll('nutrition_entries')]);mergeCloud(tables[0],tables[1],tables[2]);await upsert('workout_sets',sessionToRows());await upsert('body_weights',weightRows());await upsert('nutrition_entries',mealRows());lastSyncAt=Date.now();syncNotice='Synced successfully at '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'.';render()}catch(err){syncNotice='Sync error: '+err.message+'. Local entries are still saved. Try Sync now.';render()}finally{syncBusy=false;renderAccount()}}
async function removeMeal(id){if(auth){try{await request('/rest/v1/nutrition_entries?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{'Prefer':'return=minimal'}})}catch(err){toast('Could not delete from cloud: '+err.message);return}}state.meals=state.meals.filter(function(m){return String(m.id)!==id});save();render()}
document.addEventListener('submit',function(ev){if(ev.target.id!=='ai-chat-form')return;ev.preventDefault();var q=String(new FormData(ev.target).get('question')||'').trim();if(q)askCoach(q)});
document.addEventListener('click',function(ev){if(ev.target.closest('[data-action="ai-mic"]')){ev.preventDefault();tapToSpeak()}});
document.addEventListener('submit',function(ev){if(ev.target.id!=='auth-form')return;ev.preventDefault();var fd=new FormData(ev.target),email=String(fd.get('email')||''),password=String(fd.get('password')||'');var submitter=ev.submitter;var mode=submitter&&submitter.value||'signin';syncNotice='Contacting Supabase…';render();authenticate(email,password,mode==='signup').catch(function(err){syncNotice='Sign-in error: '+err.message;render()})});
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-action="sync-now"],[data-action="logout"]');if(!b)return;var action=b.getAttribute('data-action');if(action==='sync-now')syncCloud();if(action==='logout'){if(syncBusy){toast('Wait until synchronization finishes.');return}if(!confirm('Sign out? Local records will remain in this browser. Sign into your own account before using cloud sync again.'))return;auth=null;chatMessages=[];authStore();syncNotice='Signed out. Sign back in to view your fitness records.';render()}});
setInterval(function(){if(auth&&!syncBusy&&Date.now()-lastSyncAt>45000)syncCloud()},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&auth&&!syncBusy&&Date.now()-lastSyncAt>15000)syncCloud()});
if(auth&&auth.access_token){setTimeout(syncCloud,300)}

setInterval(function(){if(state.tab!=='workout')return;var el=document.getElementById('rest-note');if(!el)return;var remain=Math.max(0,Math.ceil((state.restEnd-Date.now())/1000));el.innerHTML=remain>0?'Rest: <strong id="rest-counter">'+remain+'</strong> seconds remaining':'Ready for the next set'},1000);
try{render()}catch(e){root.innerHTML='<div class="card"><h2>Unable to load the app</h2><p>'+esc(e.message)+'</p><p>Try opening the file in Safari or Chrome rather than an iPhone file preview.</p></div>'}
})();
</script></body></html>
