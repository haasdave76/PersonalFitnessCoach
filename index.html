<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0c1727"><title>Personal Fitness Coach</title>
<style>
:root{color-scheme:dark;--bg:#0c1727;--panel:#14243a;--panel2:#1c324b;--line:#30455e;--text:#f4f8fd;--muted:#a2b5c8;--mint:#49d7b5;--red:#ff9299}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;background:var(--mint);color:#082731;font-weight:700}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.danger{background:#66333d;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}input,select{background:#0d1b2d;color:#fff;border:1px solid var(--line);padding:12px;border-radius:10px;max-width:100%;width:100%}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 5px}h1,h2,h3,p{margin:0 0 10px}h1{font-size:26px}h2{font-size:21px}h3{font-size:17px}.wrap{max-width:760px;margin:0 auto;padding:20px 16px 110px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mint);font-weight:700}.muted,.hint{color:var(--muted)}.hint{font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{background:var(--panel2);border-radius:13px;padding:12px}.stat strong{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}.wide{width:100%;margin-top:10px}.pill{display:inline-block;font-size:12px;background:#1d534d;color:#a7ffe5;padding:5px 10px;border-radius:100px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#0d1b2d;border-top:1px solid var(--line);padding:10px 8px max(12px,env(safe-area-inset-bottom));z-index:5}.tabs button{width:33%;max-width:240px;background:transparent;color:var(--muted);font-size:14px}.tabs button.active{background:var(--panel2);color:var(--mint)}.exercise{padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}.setrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.setrow input{width:94px}.setrow button{padding:10px}.small{font-size:13px}.stack{display:grid;gap:8px}.empty{padding:18px;color:var(--muted);text-align:center}.notice{border-left:3px solid var(--mint);padding:10px 12px;background:#173347;border-radius:5px;margin:12px 0}.error{border-left-color:var(--red)}.hide{display:none!important}summary{cursor:pointer;font-weight:700}details{margin-top:10px}#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#225747;color:#fff;padding:10px 16px;border-radius:10px;z-index:10;display:none;max-width:90%;text-align:center}@media(max-width:360px){.grid3{grid-template-columns:1fr}.setrow input{width:75px}.wrap{padding-left:12px;padding-right:12px}}
</style></head><body><main class="wrap"><div class="eyebrow">Personal Fitness Coach • HTML Edition</div><h1 id="heading">Your Coach</h1><div id="app"><p>Loading your fitness coach…</p></div></main><nav class="tabs" aria-label="Main navigation"><button data-tab="coach" class="active">⌂ Coach</button><button data-tab="workout">▤ Workout</button><button data-tab="progress">▥ Progress</button></nav><div id="toast" role="status"></div>
<script>
(function(){'use strict';
var KEY='personal_fitness_coach_html_v1';
var template={upperA:[['Barbell Bench Press',3,8,10],['Seated Cable Row',3,10,12],['Dumbbell Shoulder Press',3,8,10],['Lat Pulldown',3,10,12],['Biceps Curl',2,10,12],['Triceps Pushdown',2,10,12],['Face Pull',2,12,15]],lowerA:[['Goblet Squat',3,10,12],['Barbell Romanian Deadlift',3,8,10],['Leg Press',3,10,12],['Seated Leg Curl',3,10,12],['Standing Calf Raise',3,12,15],['Forearm Plank',3,30,45]],upperB:[['Incline Dumbbell Press',3,8,10],['Cable Row',3,10,12],['Vertical Pulldown',3,10,12],['Lateral Raise',3,12,15],['Biceps Curl',2,10,12],['Triceps Extension',2,10,12],['Rear Delt Fly',2,12,15]],lowerB:[['Trap Bar Deadlift',3,6,8],['Split Squat',3,8,10],['Seated Leg Curl',3,10,12],['Leg Extension',3,10,12],['Calf Raise',3,12,15],['Cable Crunch',3,10,15]]};
var names={upperA:'Upper A',lowerA:'Lower A',upperB:'Upper B',lowerB:'Lower B',makeup:'Full-Body Makeup'};
var defaults={sessions:[],active:null,meals:[],weights:[],settings:{calories:2500,protein:180,carbs:265,fat:80},tab:'coach',restEnd:0};
function clone(x){return JSON.parse(JSON.stringify(x));}
function load(){try{var saved=JSON.parse(localStorage.getItem(KEY)||'{}');var out=clone(defaults);Object.keys(out).forEach(function(k){if(saved[k]!==undefined)out[k]=saved[k]});return out;}catch(e){return clone(defaults);}}
var state=load();var root=document.getElementById('app');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Browser storage unavailable. Export your records to keep them.');}}
function esc(s){return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(s){var el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(window._toastTimer);window._toastTimer=setTimeout(function(){el.style.display='none'},2600)}
function localDay(){var d=new Date().getDay();return d===1?'upperA':d===2?'lowerA':d===4?'upperB':d===5?'lowerB':d===0?'upperA':d===3?'upperB':'lowerB'}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function optionSet(key){return '<option value="'+key+'">'+names[key]+'</option>'}
function recommend(){var day=new Date().getDay();return {key:localDay(),when:([0,3,6].indexOf(day)>=0?'Next scheduled workout':'Scheduled for today')}}
function renderCoach(){var r=recommend(),history=state.sessions.length?state.sessions[0]:null,meal=totals();return '<div class="card"><div class="row"><div><div class="eyebrow">'+r.when+'</div><h2>'+names[r.key]+'</h2><p class="muted">Your 4-day strength plan • 60-minute default</p></div><span class="pill">Ready</span></div><button class="wide" data-action="choose-workout" data-key="'+r.key+'">Start guided workout</button><p class="hint" style="margin-top:9px">Missed a day? Choose Full-Body Makeup in the Workout tab.</p></div><div class="grid"><div class="stat"><span>Completed workouts</span><strong>'+state.sessions.length+'</strong></div><div class="stat"><span>Logged sets</span><strong>'+state.sessions.reduce(function(a,s){return a+s.exercises.reduce(function(b,e){return b+e.logs.length},0)},0)+'</strong></div></div><div class="card"><div class="row"><h3>Today&#39;s nutrition</h3><span class="muted small">'+today()+'</span></div><div class="grid"><div class="stat"><span>Calories</span><strong>'+Math.round(meal.calories)+' / '+state.settings.calories+'</strong></div><div class="stat"><span>Protein (g)</span><strong>'+Math.round(meal.protein)+' / '+state.settings.protein+'</strong></div><div class="stat"><span>Carbs (g)</span><strong>'+Math.round(meal.carbs)+' / '+state.settings.carbs+'</strong></div><div class="stat"><span>Fat (g)</span><strong>'+Math.round(meal.fat)+' / '+state.settings.fat+'</strong></div></div><details><summary>Log a meal (manual estimates)</summary><form id="meal-form" class="stack"><label>Meal description<input name="name" required placeholder="Chicken bowl, protein shake…"></label><div class="grid"><label>Calories<input name="calories" type="number" min="0" step="1" required></label><label>Protein (g)<input name="protein" type="number" min="0" step="0.1" required></label><label>Carbs (g)<input name="carbs" type="number" min="0" step="0.1" required></label><label>Fat (g)<input name="fat" type="number" min="0" step="0.1" required></label></div><button>Save meal</button></form><p class="hint">Photo-based AI estimates are not included in this offline version.</p></details>'+state.meals.filter(function(m){return m.date===today()}).map(function(m){return '<div class="exercise row"><span>'+esc(m.name)+' <span class="hint">'+Math.round(m.calories)+' kcal · '+Math.round(m.protein)+'g protein</span></span><button class="secondary small" data-action="delete-meal" data-id="'+m.id+'">Remove</button></div>'}).join('')+'</div>'+(history?'<div class="card"><h3>Last completed workout</h3><p>'+esc(history.name)+' · '+esc(history.date)+' · '+history.exercises.reduce(function(a,e){return a+e.logs.length},0)+' sets</p></div>':'')}
function totals(){return state.meals.filter(function(m){return m.date===today()}).reduce(function(a,m){['calories','protein','carbs','fat'].forEach(function(k){a[k]+=Number(m[k])||0});return a},{calories:0,protein:0,carbs:0,fat:0})}
function makeExercises(key){if(key==='makeup'){return [template.upperA[0],template.lowerA[0],template.upperA[1],template.lowerA[1],template.upperB[3],template.lowerA[5]].map(function(e){return {name:e[0],target:2,min:e[2],max:e[3],logs:[]}})}return template[key].map(function(e){return {name:e[0],target:e[1],min:e[2],max:e[3],logs:[]}})}
function renderWorkout(){var a=state.active;if(!a){return '<div class="card"><h2>Choose a workout</h2><label>Workout plan<select id="workout-type">'+['upperA','lowerA','upperB','lowerB','makeup'].map(optionSet).join('')+'</select></label><label>Available minutes<select id="duration"><option>60</option><option>45</option><option>80</option></select></label><button class="wide" data-action="start-workout">Begin workout</button><p class="hint" style="margin-top:10px">For a missed session, choose Full-Body Makeup: balanced, reduced-volume training. You can adjust the duration.</p></div><div class="card"><h3>Weekly plan</h3><p>Monday · Upper A<br>Tuesday · Lower A<br>Thursday · Upper B<br>Friday · Lower B</p></div>'}
var count=a.exercises.reduce(function(n,e){return n+e.logs.length},0),target=a.exercises.reduce(function(n,e){return n+e.target},0),remain=Math.max(0,Math.ceil((state.restEnd-Date.now())/1000));return '<div class="card"><div class="eyebrow">Active session</div><div class="row"><h2>'+esc(a.name)+'</h2><span class="pill">'+count+' / '+target+' sets</span></div><p class="muted">'+a.minutes+'-minute plan · '+esc(a.date)+'</p><div class="notice" id="rest-note">'+(remain>0?'Rest: <strong id="rest-counter">'+remain+'</strong> seconds remaining':'Ready for the next set')+'</div><div class="row"><button class="secondary" data-action="start-rest">Rest 90 sec</button><button class="secondary" data-action="clear-rest">Skip rest</button></div></div>'+a.exercises.map(function(e,i){var previous=lastWeight(e.name);return '<div class="card"><div class="row"><h3>'+(i+1)+'. '+esc(e.name)+'</h3><span class="pill">'+e.logs.length+'/'+e.target+'</span></div><p class="hint">Goal '+e.target+' × '+e.min+'–'+e.max+(e.name.indexOf('Plank')>=0?' seconds':' reps')+(previous!==null?' · Last used: '+previous+' lb':'')+'</p>'+e.logs.map(function(s,j){return '<div class="exercise row"><span>Set '+(j+1)+': '+esc(s.weight)+' '+(e.name.indexOf('Plank')>=0?'sec':'lb')+' × '+esc(s.reps)+(s.effort?' · '+esc(s.effort):'')+'</span><button class="secondary" data-action="undo-set" data-i="'+i+'">Undo</button></div>'}).join('')+(e.logs.length<e.target?'<form class="setrow log-form" data-i="'+i+'"><label>Weight / sec<input name="weight" type="number" min="0" step="0.5" placeholder="lb" value="'+(previous!==null?previous:'')+'" required></label><label>Reps / sec<input name="reps" type="number" min="1" max="300" placeholder="Reps" required></label><label>Effort<select name="effort"><option>Moderate</option><option>Easy</option><option>Hard</option></select></label><button type="submit">Log set</button></form>':'<p class="hint">✓ All planned sets logged</p>')+'</div>'}).join('')+'<div class="card"><button class="wide" data-action="finish-workout">Finish and save workout</button><button class="wide secondary" data-action="discard-workout">Discard this session</button></div>'}
function lastWeight(name){for(var i=0;i<state.sessions.length;i++){var ex=state.sessions[i].exercises.find(function(e){return e.name===name&&e.logs.length});if(ex)return ex.logs[ex.logs.length-1].weight;}return null}
function renderProgress(){return '<div class="card"><h2>Body-weight trend</h2><form id="weight-form" class="row"><label style="flex:1">Weight (lb)<input name="weight" type="number" min="50" max="800" step="0.1" placeholder="e.g. 236.6" required></label><button style="margin-top:17px">Log weight</button></form>'+state.weights.slice(0,10).map(function(w){return '<div class="exercise row"><span>'+esc(w.date)+'</span><strong>'+w.weight+' lb</strong></div>'}).join('')+'</div><div class="card"><h2>Workout history</h2>'+(state.sessions.length?state.sessions.map(function(s){var sets=s.exercises.reduce(function(a,e){return a+e.logs.length},0);return '<details class="exercise"><summary>'+esc(s.date)+' · '+esc(s.name)+' ('+sets+' sets)</summary>'+s.exercises.map(function(e){return '<p class="small">'+esc(e.name)+': '+e.logs.map(function(l){return esc(l.weight)+'×'+esc(l.reps)}).join(', ')+'</p>'}).join('')+'</details>'}).join(''):'<div class="empty">No completed workouts yet.</div>')+'</div><div class="card"><h2>Data and backups</h2><p class="hint">Records are saved in this browser on this device. Clearing website data or switching browsers can erase them. Export regularly.</p><button class="wide" data-action="export">Export data as JSON</button><label>Restore JSON backup<input type="file" id="import-file" accept="application/json,.json"></label><details><summary>Daily nutrition targets</summary><form id="goals-form" class="grid">'+['calories','protein','carbs','fat'].map(function(k){return '<label>'+k.charAt(0).toUpperCase()+k.slice(1)+'<input type="number" name="'+k+'" min="0" value="'+state.settings[k]+'" required></label>'}).join('')+'<button>Save goals</button></form></details></div>'}
function render(){document.getElementById('heading').textContent=state.tab==='coach'?'Your Coach':state.tab==='workout'?'Workout':'Progress';root.innerHTML=state.tab==='coach'?renderCoach():state.tab==='workout'?renderWorkout():renderProgress();document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===state.tab)})}
function start(key,minutes){if(state.active){toast('Finish or discard your current session first.');return}var es=makeExercises(key);if(minutes===45)es=es.slice(0,Math.min(5,es.length)).map(function(e){e.target=Math.min(e.target,2);return e});state.active={id:Date.now(),name:names[key],key:key,date:today(),minutes:minutes,exercises:es};state.tab='workout';state.restEnd=0;save();render()}
function download(name,contents){var blob=new Blob([contents],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},3000)}
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-tab],[data-action]');if(!t)return;var tab=t.getAttribute('data-tab');if(tab){state.tab=tab;save();render();return}var action=t.getAttribute('data-action');if(action==='choose-workout'){start(t.getAttribute('data-key'),60)}else if(action==='start-workout'){start(document.getElementById('workout-type').value,Number(document.getElementById('duration').value))}else if(action==='undo-set'){var x=state.active.exercises[Number(t.getAttribute('data-i'))];x.logs.pop();save();render()}else if(action==='start-rest'){state.restEnd=Date.now()+90000;save();render()}else if(action==='clear-rest'){state.restEnd=0;save();render()}else if(action==='finish-workout'){if(!state.active)return;if(!state.active.exercises.some(function(e){return e.logs.length})){toast('Log at least one set first.');return}state.sessions.unshift(state.active);state.active=null;state.restEnd=0;state.tab='progress';save();render();toast('Workout saved!')}else if(action==='discard-workout'){if(confirm('Discard the unfinished workout?')){state.active=null;state.restEnd=0;save();render()}}else if(action==='delete-meal'){state.meals=state.meals.filter(function(m){return String(m.id)!==t.getAttribute('data-id')});save();render()}else if(action==='export'){download('fitness-coach-backup-'+today()+'.json',JSON.stringify(state,null,2));toast('Backup file downloaded')}});
document.addEventListener('submit',function(ev){var f=ev.target;if(!f.matches('.log-form,#meal-form,#weight-form,#goals-form'))return;ev.preventDefault();var data=new FormData(f);if(f.matches('.log-form')){var e=state.active.exercises[Number(f.getAttribute('data-i'))];e.logs.push({weight:Number(data.get('weight')),reps:Number(data.get('reps')),effort:String(data.get('effort'))});state.restEnd=Date.now()+90000;toast('Set logged · 90-second rest started')}else if(f.id==='meal-form'){state.meals.unshift({id:Date.now(),date:today(),name:String(data.get('name')),calories:Number(data.get('calories')),protein:Number(data.get('protein')),carbs:Number(data.get('carbs')),fat:Number(data.get('fat'))});toast('Meal logged')}else if(f.id==='weight-form'){state.weights.unshift({date:today(),weight:Number(data.get('weight'))});toast('Weight logged')}else if(f.id==='goals-form'){['calories','protein','carbs','fat'].forEach(function(k){state.settings[k]=Number(data.get(k))});toast('Goals saved')}save();render()});
document.addEventListener('change',function(ev){if(ev.target.id!=='import-file'||!ev.target.files.length)return;var reader=new FileReader();reader.onload=function(){try{var incoming=JSON.parse(reader.result);if(!incoming||!Array.isArray(incoming.sessions)||!Array.isArray(incoming.meals)||!Array.isArray(incoming.weights))throw Error('Unexpected file format');if(!confirm('Replace current local fitness data with this backup?'))return;state=Object.assign(clone(defaults),incoming);state.tab='progress';save();render();toast('Backup restored')}catch(err){alert('Could not restore: '+err.message)}};reader.readAsText(ev.target.files[0])});
setInterval(function(){if(state.tab!=='workout')return;var el=document.getElementById('rest-note');if(!el)return;var remain=Math.max(0,Math.ceil((state.restEnd-Date.now())/1000));el.innerHTML=remain>0?'Rest: <strong id="rest-counter">'+remain+'</strong> seconds remaining':'Ready for the next set'},1000);
try{render()}catch(e){root.innerHTML='<div class="card"><h2>Unable to load the app</h2><p>'+esc(e.message)+'</p><p>Try opening the file in Safari or Chrome rather than an iPhone file preview.</p></div>'}
})();
</script></body></html>
